services:
  api:
    image: python:3.11-slim
    container_name: ons-restricao-api
    working_dir: /app
    volumes:
      - ${API_DIR:-./api}:/app
      - ./dados_teste:/dados_teste:ro
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - ONS_PARQUET_DIR=${ONS_PARQUET_DIR:-/dados_teste/restricao_coff_eolica_tm}
      - USINAS=${USINAS:-USINA EOLICA ALFA,USINA EOLICA BETA}
      - FONTES=eolica,fotovoltaica

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-restricao-ons
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
